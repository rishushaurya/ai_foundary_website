<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" fill="none">
  <!-- Antennae -->
  <line x1="140" y1="90" x2="105" y2="45" stroke="#2D2E2A" stroke-width="8" stroke-linecap="round" />
  <rect x="90" y="30" width="25" height="25" rx="4" fill="#2D2E2A" />

  <line x1="260" y1="90" x2="295" y2="45" stroke="#2D2E2A" stroke-width="8" stroke-linecap="round" />
  <rect x="285" y="30" width="25" height="25" rx="4" fill="#2D2E2A" />

  <!-- Ears -->
  <rect x="80" y="115" width="20" height="40" rx="4" fill="#2D2E2A" />
  <rect x="300" y="115" width="20" height="40" rx="4" fill="#2D2E2A" />

  <!-- Head -->
  <rect x="100" y="80" width="200" height="150" rx="28" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="9" />

  <!-- Eyes -->
  <rect x="135" y="120" width="40" height="40" rx="8" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="8" />
  <rect x="225" y="120" width="40" height="40" rx="8" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="8" />

  <!-- Mouth -->
  <line x1="150" y1="190" x2="250" y2="190" stroke="#2D2E2A" stroke-width="8" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="180" y="230" width="40" height="20" fill="#2D2E2A" />

  <!-- Body -->
  <rect x="120" y="250" width="160" height="130" rx="16" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="9" />

  <!-- Chest lines -->
  <line x1="155" y1="280" x2="245" y2="280" stroke="#2D2E2A" stroke-width="8" stroke-linecap="round" />
  <line x1="155" y1="305" x2="245" y2="305" stroke="#2D2E2A" stroke-width="8" stroke-linecap="round" />

  <!-- Arms -->
  <path d="M120 280 C 60 290 60 380 110 395" fill="none" stroke="#2D2E2A" stroke-width="9" stroke-linecap="round" />
  <path d="M280 280 C 340 290 340 380 290 395" fill="none" stroke="#2D2E2A" stroke-width="9" stroke-linecap="round" />

  <!-- Hands / Claws -->
  <path d="M75 365 C 65 375 65 405 95 410 C 105 410 110 390 100 375 Z" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="7" />
  <path d="M325 365 C 335 375 335 405 305 410 C 295 410 290 390 300 375 Z" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="7" />

  <!-- Banner -->
  <path d="M 60 385 Q 200 415 340 385 L 345 425 Q 200 455 55 425 Z" fill="#FFFFE9" stroke="#2D2E2A" stroke-width="8" stroke-linejoin="round" />

  <!-- Banner Text -->
  <text x="200" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#2D2E2A">ABOUT US</text>
</svg>
